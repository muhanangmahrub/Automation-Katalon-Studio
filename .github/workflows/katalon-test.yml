name: Katalon Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  KATALON_VERSION: "11.1.3"

jobs:
  test:
    name: ${{ matrix.suite.name }}
    runs-on: macos-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Authentication
            args: '-testSuitePath="Test Suites/TS_Authentication" -browserType="Chrome (headless)"'
          - name: Product_And_Navigation
            args: '-testSuitePath="Test Suites/TS_Product_And_Navigation" -browserType="Chrome (headless)"'
          - name: Regression_CrossBrowser
            args: '-testSuiteCollectionPath="Test Suites/TSC_Regression_CrossBrowser"'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Katalon Studio
        uses: actions/cache@v4
        with:
          path: ~/.katalon
          key: katalon-studio-${{ runner.os }}-${{ env.KATALON_VERSION }}

      - name: Prepare Katalon Studio (fix macOS space-in-path bug)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ env.KATALON_VERSION }}"
          KATALON_DIR="$HOME/.katalon/$VERSION"
          DONE_FILE="$KATALON_DIR/.katalon.done"

          if [ ! -f "$DONE_FILE" ]; then
            URL="https://download.katalon.com/$VERSION/Katalon_Studio_Engine_MacOS-$VERSION.tar.gz"
            echo "Downloading Katalon Studio Engine from $URL"
            mkdir -p "$KATALON_DIR"
            curl -sL "$URL" -o /tmp/katalon-engine.tar.gz
            tar -xzf /tmp/katalon-engine.tar.gz -C "$KATALON_DIR"
            rm -f /tmp/katalon-engine.tar.gz
            touch "$DONE_FILE"
          fi

          # Katalon's macOS engine ships as "Katalon Studio Engine.app" — the space in
          # that directory name breaks an internal file: URI lookup for katalon.ini.
          # Rename just the bundle wrapper (contents untouched). Runs unconditionally
          # so it also self-heals caches populated before this fix existed.
          find "$KATALON_DIR" -type d -iname "*.app" | while read -r appdir; do
            base=$(basename "$appdir")
            if [[ "$base" == *" "* ]]; then
              newpath="$(dirname "$appdir")/$(echo "$base" | tr -d ' ')"
              echo "Renaming '$appdir' -> '$newpath'"
              mv "$appdir" "$newpath"
            fi
          done

      - name: Katalon Studio GitHub Action
        uses: katalon-studio/katalon-studio-github-action@v4.0
        with:
          version: ${{ env.KATALON_VERSION }}
          projectPath: "${{ github.workspace }}"
          args: '-noSplash -retry=0 ${{ matrix.suite.args }} -apiKey=${{ secrets.KATALON_API_KEY }} --config -webui.autoUpdateDrivers=true'
